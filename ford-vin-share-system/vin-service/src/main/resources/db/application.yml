server:
  port: 8081

spring:
  application:
    name: vin-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ford_vin_share
    username: ${DB_USERNAME:ford_user}  # Environment variable with default
    password: ${DB_PASSWORD:ford_password}  # Environment variable with default
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging - Security improved: Never log sensitive data
logging:
  level:
    com.ford.vinservice: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: DEBUG

# JWT Configuration - Security improved: Short expiration, no hardcoded secret
jwt:
  secret: ${JWT_SECRET:Rm9yZFZpblNoYXJlU3lzdGVtU2VjcmV0S2V5Rm9yU3ByaW50M0F1dGhlbnRpY2F0aW9uMjAyNCE=}  # Use env var in production!
  expiration: 900000  # 15 minutos (seguro)
  refresh-expiration: 604800000  # 7 dias
