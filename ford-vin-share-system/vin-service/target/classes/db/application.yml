server:
  port: 8081

spring:
  application:
    name: vin-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ford_vin_share
    username: ford_user
    password: ford_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.ford.vinservice: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: DEBUG

# JWT Configuration
jwt:
  secret: Rm9yZFZpblNoYXJlU3lzdGVtU2VjcmV0S2V5Rm9yU3ByaW50M0F1dGhlbnRpY2F0aW9uMjAyNCE=
  expiration: 86400000
